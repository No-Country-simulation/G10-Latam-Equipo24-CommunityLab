# Aviso: NO fijar `server.port` en este archivo.
#
# Esta configuración la lee cualquier `streamlit run` sobre el repo, en
# cualquier entorno, incluido Streamlit Community Cloud. La nube arranca la app
# y verifica su salud en el puerto 8501 (`GET http://localhost:8501/healthz`);
# si este archivo fuerza otro puerto, el health check nunca conecta y el deploy
# termina en "Error running app" aunque la app funcione bien.
#
# El puerto fijo del desarrollo local (8502, para no confundir la instancia
# propia con otras que queden escuchando) se pasa en la línea de comandos al
# arrancar: ver `make run` y `PORT` en el Makefile. La línea de comandos tiene
# prioridad sobre este archivo, así que el puerto por defecto de la nube queda
# intacto.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

[theme.light]
primaryColor = "#0B2D4A"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E2A3A"

[theme.dark]
primaryColor = "#00C2AB"
backgroundColor = "#0B1728"
secondaryBackgroundColor = "#13283E"
textColor = "#F4F7FB"
