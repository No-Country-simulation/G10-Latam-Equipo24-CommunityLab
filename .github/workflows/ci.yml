name: CI

on:
  # El PR ya valida cada push a una rama de trabajo. Correr tambien en
  # `push` para todas las ramas duplicaba el check `test` sobre el mismo
  # commit: doble minuto de runner, dos notificaciones y un estado ambiguo
  # para el check requerido de main.
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# Un push nuevo cancela el run anterior de la misma rama/PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v
      
      - name: Run linting
        run: |
          flake8 src tests scripts
