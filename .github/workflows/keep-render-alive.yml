name: Keep Render Alive
on:
  schedule:
    - cron: '*/5 * * * *'  # cada 5 minutos
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render /health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          set -euo pipefail
          url="https://g10-latam-equipo24-communitylab.onrender.com/health"
          echo "Pinging $url ..."
          if curl -sf --max-time 10 "$url" > /dev/null; then
            echo "✅ Render responded 200 OK"
          else
            echo "❌ Render did not respond 200"
            exit 1
          fi
